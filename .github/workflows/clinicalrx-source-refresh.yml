name: ClinicalRx official source checks
on:
  schedule:
    - cron: "23 12 * * *"
    - cron: "41 13 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clinicalrx-source-refresh
  cancel-in-progress: false
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "requests>=2.31,<3"
      - name: Check official source pages
        run: python scripts/clinicalrx_source_monitor.py --registry docs/data/source-registry.json --report source-monitor-report.json
      - name: Upload source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinicalrx-source-check-${{ github.run_id }}
          path: source-monitor-report.json
          retention-days: 30
# This workflow checks availability and page hashes only. It intentionally does not
# commit or publish data. Add source-specific retrieval, validation, diff and release
# jobs after each official dataset schema and clinical acceptance test is established.
