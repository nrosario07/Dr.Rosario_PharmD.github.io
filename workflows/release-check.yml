name: ClinicalRx release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public bundle integrity
        run: python scripts/validate-site.py
      - name: Application regression tests
        run: node --test tests/*.test.js
      - name: Source governance tests
        run: python -m unittest discover -s tests -p 'test_*.py'
