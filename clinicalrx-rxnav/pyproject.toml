[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
[project]
name = "clinicalrx-rxnav"
version = "0.1.0"
description = "Typed Python client for official NLM RxNav APIs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["requests>=2.31,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "responses>=0.25,<1"]
[project.scripts]
rxnav = "clinicalrx_rxnav.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/clinicalrx_rxnav"]
