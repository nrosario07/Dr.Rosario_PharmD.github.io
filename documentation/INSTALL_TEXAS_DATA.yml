name: ClinicalRx Texas public data retrieval
on:
  schedule:
    - cron: '17 18 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: texas-public-data
  cancel-in-progress: false
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official files without publishing
        run: python scripts/fetch-texas-vdp.py --output "$RUNNER_TEMP/texas-vdp"
      - name: Preserve retrieval report and staged files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-vdp-review-${{ github.run_id }}
          path: ${{ runner.temp }}/texas-vdp
          retention-days: 14
